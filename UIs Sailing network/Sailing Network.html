<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sailing Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #080b10;
    --ocean-a:   #05111f;
    --ocean-b:   #091e32;
    --ocean-c:   #0c2c44;
    --acc:       #e23b32;
    --acc2:      #e3b24c;
    --glass:     rgba(14,18,26,0.72);
    --glass2:    rgba(14,18,26,0.90);
    --edge:      rgba(255,255,255,0.09);
    --edge2:     rgba(255,255,255,0.14);
    --txt:       #e8edf4;
    --muted:     #8a95a8;
    --font:      'Manrope', system-ui, sans-serif;
    --display:   'Sora', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: var(--font); color: var(--txt); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; }

  /* ─── LAYOUT ─────────────────────────────────────────────── */
  .page { display: grid; grid-template-columns: 480px 1fr; height: 100vh; }

  /* ─── LEFT – login side ─────────────────────────────────── */
  .login-side {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 52px;
    background: var(--glass2);
    border-right: 1px solid var(--edge);
    box-shadow: 8px 0 48px rgba(0,0,0,0.5);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }

  /* subtle grain */
  .login-side::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .25; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .login-inner { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 32px; position: relative; z-index: 1; }

  /* LOGO */
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo-icon { width: 48px; height: 48px; flex-shrink: 0; }
  .logo-text { display: flex; flex-direction: column; gap: 1px; }
  .logo-name { font: 800 22px/1 var(--display); letter-spacing: 2px; text-transform: uppercase; color: var(--txt); }
  .logo-tagline { font: 500 11px var(--font); letter-spacing: 1.5px; text-transform: uppercase; color: var(--acc2); }

  /* FORM */
  .login-form { display: flex; flex-direction: column; gap: 14px; }
  .form-label { font: 600 11px var(--display); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: block; }
  .form-group { display: flex; flex-direction: column; }
  .form-input {
    background: rgba(255,255,255,0.05); border: 1px solid var(--edge2);
    border-radius: 12px; padding: 13px 16px; font: 500 14px var(--font); color: var(--txt);
    transition: border-color .2s, box-shadow .2s; outline: none;
  }
  .form-input::placeholder { color: var(--muted); }
  .form-input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(226,59,50,0.15); }

  .btn-primary {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(160deg, #f04037 0%, var(--acc) 45%, #a82820 100%);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
    padding: 15px; font: 700 15px var(--display); letter-spacing: 1px; text-transform: uppercase;
    color: #fff; cursor: pointer; transition: filter .15s, transform .1s;
    box-shadow: 0 8px 24px rgba(226,59,50,0.40), 0 1px 0 rgba(255,255,255,0.14) inset;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { transform: translateY(1px); }

  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font: 500 11px var(--font); letter-spacing: 1px; text-transform: uppercase; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--edge2); }

  .cta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-glass {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    text-decoration: none; color: var(--txt);
    background: rgba(255,255,255,0.05); border: 1px solid var(--edge2);
    border-radius: 12px; padding: 13px 10px; font: 600 13px var(--display); letter-spacing: .5px;
    color: var(--txt); cursor: pointer; transition: background .15s, border-color .15s, transform .1s;
  }
  .btn-glass:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.22); }
  .btn-glass.highlight { border-color: rgba(227,178,76,0.45); color: var(--acc2); }
  .btn-glass.highlight:hover { background: rgba(227,178,76,0.08); }
  .btn-glass:active { transform: translateY(1px); }

  .login-footer { text-align: center; font: 500 12px var(--font); color: var(--muted); }
  .login-footer a { color: var(--acc2); text-decoration: none; font-weight: 700; }
  .login-footer a:hover { text-decoration: underline; }

  /* ─── RIGHT – animated ocean scene ─────────────────────── */
  .scene-side {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--ocean-a) 0%, var(--ocean-b) 50%, var(--ocean-c) 100%);
  }

  /* starfield */
  .stars { position: absolute; inset: 0; pointer-events: none; }

  /* the "Grand Line" giant text watermark */
  .grand-line-text {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font: 900 160px/1 var(--display); letter-spacing: 16px; text-transform: uppercase;
    color: rgba(255,255,255,0.026); white-space: nowrap; pointer-events: none;
    text-align: center;
  }

  /* hero frame – gold-bordered portrait card */
  .hero-frame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 280px; height: 390px;
    border-radius: 16px;
    border: 2px solid var(--acc2);
    box-shadow: 0 0 0 6px rgba(8,11,16,0.6), 0 0 60px rgba(227,178,76,0.22), 0 30px 80px rgba(0,0,0,0.6);
    overflow: hidden;
    animation: float 5s ease-in-out infinite;
    z-index: 4;
  }
  .hero-frame image-slot { display: block; width: 100%; height: 100%; }
  .hero-frame-glow {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 340px; height: 450px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(227,178,76,0.14) 0%, transparent 70%);
    pointer-events: none; z-index: 3;
    animation: pulse-glow 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
    50%       { transform: translate(-50%, -50%) translateY(-14px); }
  }
  @keyframes pulse-glow {
    0%, 100% { opacity: 0.7; }
    50%       { opacity: 1; }
  }

  /* compass rose */
  .compass-wrap {
    position: absolute; bottom: 52px; right: 52px; z-index: 5;
    width: 90px; height: 90px; opacity: 0.7;
    animation: spin-slow 24s linear infinite;
  }
  @keyframes spin-slow { to { transform: rotate(360deg); } }

  /* waves */
  .waves-container { position: absolute; bottom: 0; left: 0; right: 0; height: 220px; pointer-events: none; z-index: 2; }
  .wave { position: absolute; bottom: 0; left: 0; width: 200%; animation: wave-drift linear infinite; }
  .wave-1 { animation-duration: 12s; opacity: 0.55; }
  .wave-2 { animation-duration: 18s; opacity: 0.35; animation-direction: reverse; bottom: 10px; }
  .wave-3 { animation-duration: 8s;  opacity: 0.20; bottom: 20px; }

  @keyframes wave-drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ship */
  .ship-wrap {
    position: absolute; bottom: 148px; left: 50%; transform: translateX(-50%);
    z-index: 3; animation: ship-rock 6s ease-in-out infinite;
  }
  @keyframes ship-rock {
    0%, 100% { transform: translateX(-50%) rotate(-1.5deg) translateY(0); }
    50%       { transform: translateX(-50%) rotate(1.5deg) translateY(-6px); }
  }

  /* floating particles */
  .particle {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.6);
    pointer-events: none; animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-160px) scale(0.3); opacity: 0; }
  }

  /* corner scene label */
  .scene-label {
    position: absolute; top: 36px; left: 42px; z-index: 6;
    display: flex; align-items: center; gap: 10px;
  }
  .scene-label .pill {
    background: rgba(14,18,26,0.7); border: 1px solid var(--edge2);
    border-radius: 20px; padding: 6px 14px; font: 600 11px var(--display);
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted);
    backdrop-filter: blur(8px);
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #3cdd7a;
    box-shadow: 0 0 8px #3cdd7a; animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* stat floaters */
  .stat-float {
    position: absolute; z-index: 6;
    background: rgba(14,18,26,0.78); border: 1px solid var(--edge2);
    border-radius: 14px; padding: 10px 16px; backdrop-filter: blur(10px);
    display: flex; flex-direction: column; gap: 2px;
    animation: float-stat 6s ease-in-out infinite;
  }
  .stat-float:nth-child(2) { animation-delay: -3s; }
  .stat-float .stat-val { font: 700 20px var(--display); color: var(--acc2); }
  .stat-float .stat-lbl { font: 500 10px var(--font); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  @keyframes float-stat {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-6px); }
  }
</style>
</head>
<body>

<div class="page">

  <!-- ════════ LEFT: LOGIN ════════ -->
  <aside class="login-side">
    <div class="login-inner">

      <!-- Logo -->
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="22" stroke="rgba(227,178,76,0.6)" stroke-width="1.5"/>
          <circle cx="24" cy="24" r="4" fill="#e3b24c"/>
          <!-- compass points -->
          <path d="M24 5 L27 21 L24 19 L21 21 Z" fill="#e23b32"/>
          <path d="M24 43 L21 27 L24 29 L27 27 Z" fill="#e8edf4" opacity=".7"/>
          <path d="M5 24 L21 21 L19 24 L21 27 Z" fill="#e8edf4" opacity=".7"/>
          <path d="M43 24 L27 27 L29 24 L27 21 Z" fill="#e8edf4" opacity=".7"/>
          <!-- diagonal points -->
          <path d="M10.5 10.5 L21 21" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <path d="M37.5 10.5 L27 21" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <path d="M10.5 37.5 L21 27" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <path d="M37.5 37.5 L27 27" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <circle cx="24" cy="24" r="1.5" fill="#fff"/>
        </svg>
        <div class="logo-text">
          <span class="logo-name">Sailing Network</span>
          <span class="logo-tagline">One Piece TCG Platform</span>
        </div>
      </div>

      <!-- Form -->
      <form class="login-form" action="Home.html" method="get" onsubmit="return false">
        <div class="form-group">
          <label class="form-label" for="email">Navigator ID</label>
          <input class="form-input" id="email" type="email" placeholder="pirate@grandline.net" autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="form-label" for="pass">Secret Log</label>
          <input class="form-input" id="pass" type="password" placeholder="••••••••" />
        </div>
        <button class="btn-primary" type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="rgba(255,255,255,0.2)"/><path d="M8 12h8M13 9l3 3-3 3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Set Sail
        </button>
      </form>

      <div class="divider">or continue as</div>

      <div class="cta-row">
        <button class="btn-glass">Register</button>
        <a class="btn-glass highlight" href="Duel Records.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M18 20V10M12 20V4M6 20v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Watch Stats
        </a>
      </div>

      <p class="login-footer">
        No account? <a href="#">Join the crew →</a>
      </p>

    </div>
  </aside>

  <!-- ════════ RIGHT: SCENE ════════ -->
  <main class="scene-side" id="scene">

    <!-- Stars canvas -->
    <canvas class="stars" id="starCanvas"></canvas>

    <!-- Watermark -->
    <div class="grand-line-text">GRAND LINE</div>

    <!-- Live indicator -->
    <div class="scene-label">
      <span class="live-dot"></span>
      <span class="pill">ROMANCE DAWN - DEMO SEASON
</span>
    </div>

    <!-- Stat floaters -->
    <div class="stat-float" style="top:36px;right:52px;">
      <span class="stat-val">12,483</span>
      <span class="stat-lbl">Captains online</span>
    </div>
    <div class="stat-float" style="top:108px;right:52px;animation-delay:-2s;">
      <span class="stat-val">3,201</span>
      <span class="stat-lbl">Matches today</span>
    </div>

    <!-- Hero card frame -->
    <div class="hero-frame-glow"></div>
    <div class="hero-frame">
      <image-slot id="hero-art" shape="rounded" radius="14" placeholder="Drop your One Piece art here"></image-slot>
    </div>

    <!-- Ship -->
    <div class="ship-wrap">
      <svg width="260" height="100" viewBox="0 0 260 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Hull -->
        <path d="M10 72 Q130 95 250 72 L240 82 Q130 106 20 82 Z" fill="#0e1826" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <path d="M18 76 Q130 92 242 76" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <!-- Mast 1 (main) -->
        <line x1="130" y1="12" x2="130" y2="72" stroke="#1c2c3e" stroke-width="4"/>
        <!-- Mast 2 (fore) -->
        <line x1="80" y1="28" x2="80" y2="72" stroke="#1c2c3e" stroke-width="3"/>
        <!-- Main sail -->
        <path d="M132 14 L166 42 L132 70 Z" fill="rgba(232,237,244,0.88)"/>
        <path d="M128 14 L94 42 L128 70 Z" fill="rgba(232,237,244,0.72)"/>
        <!-- Fore sail -->
        <path d="M82 30 L106 48 L82 66 Z" fill="rgba(232,237,244,0.65)"/>
        <path d="M78 30 L54 48 L78 66 Z" fill="rgba(232,237,244,0.5)"/>
        <!-- Jib -->
        <path d="M80 30 Q50 40 20 72 L80 72 Z" fill="rgba(232,237,244,0.30)"/>
        <!-- Flag -->
        <path d="M130 12 L152 4 L130 -4 Z" fill="#e23b32"/>
        <!-- Portholes -->
        <circle cx="70" cy="82" r="4" fill="rgba(227,178,76,0.5)"/>
        <circle cx="100" cy="86" r="4" fill="rgba(227,178,76,0.5)"/>
        <circle cx="130" cy="88" r="4" fill="rgba(227,178,76,0.5)"/>
        <circle cx="160" cy="86" r="4" fill="rgba(227,178,76,0.5)"/>
        <circle cx="190" cy="82" r="4" fill="rgba(227,178,76,0.5)"/>
      </svg>
    </div>

    <!-- Waves -->
    <div class="waves-container">
      <svg class="wave wave-1" viewBox="0 0 1440 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" height="120">
        <path d="M0 60 C120 20 240 100 360 60 C480 20 600 100 720 60 C840 20 960 100 1080 60 C1200 20 1320 100 1440 60 L1440 120 L0 120 Z" fill="#0c2035"/>
        <path d="M1440 60 C1560 20 1680 100 1800 60 C1920 20 2040 100 2160 60 C2280 20 2400 100 2520 60 C2640 20 2760 100 2880 60 L2880 120 L1440 120 Z" fill="#0c2035"/>
      </svg>
      <svg class="wave wave-2" viewBox="0 0 1440 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" height="100">
        <path d="M0 50 C180 10 360 90 540 50 C720 10 900 90 1080 50 C1260 10 1440 90 1440 50 L1440 100 L0 100 Z" fill="#091826" opacity="0.9"/>
        <path d="M1440 50 C1620 10 1800 90 1980 50 C2160 10 2340 90 2520 50 C2700 10 2880 90 2880 50 L2880 100 L1440 100 Z" fill="#091826" opacity="0.9"/>
      </svg>
      <svg class="wave wave-3" viewBox="0 0 1440 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" height="80">
        <path d="M0 40 C240 5 480 75 720 40 C960 5 1200 75 1440 40 L1440 80 L0 80 Z" fill="#08131f"/>
        <path d="M1440 40 C1680 5 1920 75 2160 40 C2400 5 2640 75 2880 40 L2880 80 L1440 80 Z" fill="#08131f"/>
      </svg>
    </div>

    <!-- Compass rose -->
    <svg class="compass-wrap" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="45" cy="45" r="42" stroke="rgba(227,178,76,0.30)" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="32" stroke="rgba(227,178,76,0.16)" stroke-width="1"/>
      <!-- 8 compass ticks -->
      <g stroke="rgba(227,178,76,0.5)" stroke-width="1.5">
        <line x1="45" y1="5" x2="45" y2="15"/>
        <line x1="45" y1="75" x2="45" y2="85"/>
        <line x1="5" y1="45" x2="15" y2="45"/>
        <line x1="75" y1="45" x2="85" y2="45"/>
      </g>
      <g stroke="rgba(227,178,76,0.25)" stroke-width="1">
        <line x1="16.7" y1="16.7" x2="23.5" y2="23.5"/>
        <line x1="73.3" y1="16.7" x2="66.5" y2="23.5"/>
        <line x1="16.7" y1="73.3" x2="23.5" y2="66.5"/>
        <line x1="73.3" y1="73.3" x2="66.5" y2="66.5"/>
      </g>
      <!-- N arrow (red) -->
      <path d="M45 14 L49 42 L45 38 L41 42 Z" fill="#e23b32"/>
      <!-- S arrow -->
      <path d="M45 76 L41 48 L45 52 L49 48 Z" fill="rgba(232,237,244,0.55)"/>
      <!-- E / W -->
      <path d="M76 45 L48 41 L52 45 L48 49 Z" fill="rgba(232,237,244,0.55)"/>
      <path d="M14 45 L42 49 L38 45 L42 41 Z" fill="rgba(232,237,244,0.55)"/>
      <!-- Center -->
      <circle cx="45" cy="45" r="4" fill="#e3b24c"/>
      <circle cx="45" cy="45" r="2" fill="#fff"/>
      <!-- N label -->
      <text x="45" y="11" text-anchor="middle" fill="#e23b32" font-size="7" font-family="Sora,sans-serif" font-weight="700">N</text>
    </svg>

  </main>
</div>

<script src="image-slot.js"></script>
<script>
  /* ── Star field ─────────────────────────────────────── */
  (function () {
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      initStars();
    }

    function initStars() {
      stars = Array.from({ length: 160 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height * 0.72,
        r: Math.random() * 1.4 + 0.3,
        a: Math.random(),
        speed: Math.random() * 0.4 + 0.1,
        phase: Math.random() * Math.PI * 2
      }));
    }

    function draw(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.001 * s.speed + s.phase));
        ctx.globalAlpha = s.a * twinkle;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
  })();

  /* ── Floating sea-foam particles ───────────────────── */
  (function () {
    const scene = document.getElementById('scene');
    function spawn() {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 3 + 1;
      const x = 20 + Math.random() * 80; // % of scene width
      const duration = 3 + Math.random() * 4;
      const delay = Math.random() * 6;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${x}%;
        bottom:${100 + Math.random() * 60}px;
        opacity:0;
        animation-duration:${duration}s;
        animation-delay:${delay}s;
      `;
      scene.appendChild(p);
      setTimeout(() => p.remove(), (duration + delay) * 1000 + 200);
    }
    setInterval(spawn, 320);
    for (let i = 0; i < 18; i++) spawn();
  })();
</script>
</body>
</html>
