<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>One Piece TCG Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #090b0f;
    --bg-2: #12161d;
    --felt: #13222b;            /* tunable via tweak */
    --accent: #e23b32;          /* tunable via tweak */
    --accent-2: #e3b24c;        /* gold */
    --card-back: #1b2440;       /* tunable via tweak */
    --don-back: #1f5a4d;
    --glass: rgba(17,21,28,0.66);
    --glass-2: rgba(24,29,38,0.82);
    --glass-edge: rgba(255,255,255,0.10);
    --text: #e9edf3;
    --muted: #98a2b2;
    --sel: #ffd25a;
    --you-tint: rgba(227,178,76,0.10);
    --you-edge: rgba(227,178,76,0.40);
    --opp-tint: rgba(96,150,210,0.10);
    --opp-edge: rgba(120,170,225,0.38);
    --font: "Manrope", system-ui, sans-serif;
    --display: "Sora", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: var(--font);
    color: var(--text);
    background:
      radial-gradient(120% 90% at 50% 12%, rgba(255,255,255,0.05), transparent 55%),
      radial-gradient(150% 120% at 50% 100%, #0e1320 0%, var(--bg) 60%);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body::after {  /* fine grain overlay */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: 0.35; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
  }
  #root { height: 100%; width: 100%; position: relative; z-index: 1; }

  /* ----- layout ----- */
  .app {
    height: 100%;
    width: 100%;
    display: grid;
    grid-template-columns: clamp(175px, 25vw, 450px) minmax(0, 1fr) clamp(240px, 22vw, 360px);
    gap: 14px;
    padding: 16px;
  }
  .app.layout-centered {
    grid-template-columns: clamp(100px, 12vw, 180px) minmax(0, 1fr) clamp(200px, 20vw, 320px);
  }

  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .col-left { justify-content: space-between; gap: 12px; }
  .col-center { align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .col-right { justify-content: space-between; align-items: stretch; gap: 12px; }

  /* ----- glass panels ----- */
  .panel {
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 18px 40px rgba(0,0,0,0.45);
  }
  .btn {
    font: 600 13px var(--font);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
    border: 1px solid var(--glass-edge);
    border-radius: 10px;
    padding: 9px 10px;
    cursor: pointer;
    color: var(--text);
    line-height: 1.15;
    text-align: center;
    transition: border-color .15s, background .15s, transform .08s;
  }
  .btn:hover { border-color: var(--accent); background: linear-gradient(180deg, rgba(226,59,50,0.16), rgba(226,59,50,0.04)); }
  .btn:active { transform: translateY(1px); }
  .btn.small { font-size: 12px; padding: 7px 9px; border-radius: 9px; }

  /* ----- hands ----- */
  .hand { display: flex; justify-content: center; padding: 6px 10px; }
  .hand-fan { position: relative; height: 92px; width: 100%; }
  .hand-fan .card { width: 68px !important; height: 86px !important; border-radius: 6px !important; }
  .hand-fan .card { box-shadow: -6px 6px 16px rgba(0,0,0,0.5); transition: transform .14s ease, box-shadow .14s; }
  .hand-fan .card:hover { z-index: 50 !important; box-shadow: -6px 10px 22px rgba(0,0,0,0.6); }
  .hand-fan.over { outline: 2px dashed var(--accent); outline-offset: 6px; border-radius: 10px; }
  .hand-empty { color: var(--muted); font-size: 12px; padding: 6px; position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; }

  /* ----- cards ----- */
  .card {
    width: 224px; height: 314px;
    border-radius: 14px;
    border: 1px solid rgba(0,0,0,0.55);
    position: relative;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; text-align: center;
    transition: transform .14s ease, box-shadow .14s ease, outline-color .14s;
    outline: 2px solid transparent;
    outline-offset: 1px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  /* glossy sheen shared by face-down/face-up/don */
  .card.back::before, .card.don::before, .card.front::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(125deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.05) 22%, transparent 42%);
  }
  .card.back {
    background:
      radial-gradient(70% 55% at 50% 36%, rgba(255,255,255,0.10), transparent 60%),
      linear-gradient(160deg, color-mix(in srgb, var(--card-back) 78%, white 8%), var(--card-back) 60%, #0c1020 100%);
    color: #cdd2ff;
    border-color: rgba(0,0,0,0.6);
  }
  .card.back::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 70px; height: 70px; margin: -35px 0 0 -35px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, rgba(255,255,255,0.35), transparent 55%), conic-gradient(from 220deg, var(--accent-2), #8a6a1e, var(--accent-2));
    box-shadow: 0 0 0 2px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.5) inset;
  }
  .card.front {
    background:
      linear-gradient(160deg, #2b3543 0%, #1a212c 58%, #141a23 100%);
    color: #cfd6e2;
    border: 1px solid rgba(255,255,255,0.08);
    flex-direction: column; gap: 2px;
    font-size: 9px; letter-spacing: .3px;
  }
  .card.front::before {  /* faux art window */
    content: ""; position: absolute; top: 8px; left: 8px; right: 8px; height: 150px;
    border-radius: 5px;
    background: linear-gradient(150deg, rgba(120,150,190,0.30), rgba(40,52,70,0.45));
    box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset, 0 0 0 1px rgba(0,0,0,0.25);
  }
  .card.front .pip {
    width: 38px; height: 38px; border-radius: 50%;
    position: absolute; top: 9px; left: 9px; z-index: 2;
    background: radial-gradient(circle at 36% 30%, #fff, var(--accent) 70%);
    border: 1px solid rgba(0,0,0,0.4);
    box-shadow: 0 2px 5px rgba(0,0,0,0.45);
  }
  .card.leader {
    border: 2px solid var(--accent-2);
    background: #0e1219;
    padding: 0;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 0 18px rgba(227,178,76,0.28), 0 8px 18px rgba(0,0,0,0.5);
  }
  .card.leader image-slot { width: 100%; height: 100%; display: block; border-radius: 7px; overflow: hidden; }
  .card.don {
    background:
      radial-gradient(60% 50% at 50% 40%, rgba(255,255,255,0.16), transparent 60%),
      linear-gradient(160deg, #25705f, var(--don-back) 55%, #0f2c25 100%);
    color: #eafff7;
  }
  .card.don::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 82px; height: 82px; margin: -41px 0 0 -41px; border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, #fff6da, var(--accent-2) 55%, #9a7322 100%);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.35), 0 3px 8px rgba(0,0,0,0.5);
  }
  .card.don.rested { transform: rotate(90deg); filter: brightness(0.78) saturate(0.9); }
  .card.selectable { cursor: pointer; }
  .card.selectable:hover { transform: translateY(-10px); box-shadow: 0 16px 26px rgba(0,0,0,0.55); }
  .card.don.rested.selectable:hover { transform: rotate(90deg) translateY(-10px); }
  .card.selected { outline-color: var(--sel); box-shadow: 0 0 16px var(--sel), 0 8px 18px rgba(0,0,0,0.5); }
  .card.dragging { opacity: .4; }
  .card .count {
    position: absolute; bottom: -10px; right: -9px; z-index: 3;
    background: linear-gradient(180deg, var(--accent), #a8261f);
    color: #fff; font: 700 14px var(--display);
    min-width: 30px; height: 30px; line-height: 30px;
    border-radius: 15px; padding: 0 7px; text-align: center;
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 3px 7px rgba(0,0,0,0.5);
  }

  /* ----- playmat ----- */
  .mat {
    width: 2254px;
    height: auto;
    position: absolute;
    top: 50%; left: 50%;
    transform-origin: center center;
    display: flex; flex-direction: column;
    padding: 26px 36px; gap: 28px;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.07);
    background:
      radial-gradient(80% 60% at 50% 50%, rgba(255,255,255,0.05), transparent 70%),
      radial-gradient(120% 90% at 50% 50%, color-mix(in srgb, var(--felt) 86%, var(--accent) 6%), var(--felt) 55%, #0b1419 100%);
    box-shadow:
      0 0 0 8px rgba(0,0,0,0.35),
      0 30px 70px rgba(0,0,0,0.6),
      0 1px 0 rgba(255,255,255,0.08) inset;
  }
  .mat::before {  /* felt weave texture */
    content: ""; position: absolute; inset: 0; border-radius: 22px; pointer-events: none;
    opacity: 0.5; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
  }
  .name-tag {
    position: absolute; left: 50%; transform: translateX(-50%);
    font: 700 14px var(--display); letter-spacing: 1.5px;
    color: var(--text);
    background: var(--glass-2); padding: 5px 18px 5px 14px; border-radius: 20px;
    border: 1px solid var(--glass-edge);
    box-shadow: 0 8px 18px rgba(0,0,0,0.5);
    z-index: 6; display: flex; align-items: center; gap: 8px;
  }
  .name-tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .name-tag.top { top: -14px; }
  .name-tag.bot { bottom: -14px; }
  .name-tag.bot::before { background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); }

  .half { display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 1; width: 100%; }
  .half.opp { transform: rotate(180deg); }

  .band { display: flex; gap: 12px; align-items: center; width: 100%; }
  .zone {
    border-radius: 12px; position: relative;
    display: flex; align-items: center; justify-content: center;
    gap: 5px; padding: 5px;
  }
  .zone .label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font: 800 17px var(--display); letter-spacing: 3px;
    color: rgba(255,255,255,0.13); pointer-events: none; text-transform: uppercase;
  }
  .zone.tint {
    box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 6px 16px rgba(0,0,0,0.28) inset;
  }
  .you .zone.tint { background: var(--you-tint); border: 1px solid var(--you-edge); }
  .opp .zone.tint { background: var(--opp-tint); border: 1px solid var(--opp-edge); }
  .zone.drop-ok { outline: 2px dashed var(--accent); outline-offset: -3px; background: rgba(226,59,50,0.18); }

  .slot {
    width: 224px; height: 314px; border-radius: 14px;
    border: 1px dashed rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto; font: 600 11px var(--display); letter-spacing: 1px; color: rgba(255,255,255,0.28);
    background: rgba(255,255,255,0.03); cursor: pointer; text-transform: uppercase;
    transition: background .15s, border-color .15s;
  }
  .slot:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.3); }
  .char-row { display: flex; gap: 0; align-items: center; justify-content: space-evenly; flex-wrap: nowrap; width: 100%; }
  .cost-row { display: flex; align-items: center; justify-content: center; gap: 0; }
  .cost-row .card + .card { margin-left: -136px; }
  .cost-row .card { box-shadow: -6px 0 12px rgba(0,0,0,0.45); }

  .mini-label {
    position: absolute; top: -17px; left: 0; right: 0;
    text-align: center; font: 700 9px var(--display); 
    color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase;
  }
  .zcol { display: flex; flex-direction: column; align-items: center; }

  /* ----- middle band ----- */
  .mid-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; }
  .mid-left  { justify-self: start; display: flex; align-items: center; gap: 18px; padding-left: 10px; }
  .mid-center{ justify-self: center; }
  .mid-right { justify-self: end; display: flex; align-items: center; gap: 18px; padding-right: 10px; }

  /* life cards: full-size landscape, stacked */
  .life-stack { display: flex; flex-direction: column; align-items: center; }
  .card.life-card { width: 314px; height: 224px; }
  .card.life-card + .card.life-card { margin-top: -160px; }
  .card.life-card::after { width: 64px; height: 64px; margin: -32px 0 0 -32px; }
  .life-stack.selectable { cursor: pointer; }
  .life-stack.sel .card.life-card { outline: 2px solid var(--sel); box-shadow: 0 0 10px var(--sel); }

  /* ----- chat ----- */
  .chat { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px; gap: 10px; }
  .chat-log {
    flex: 1; min-height: 0; overflow-y: auto;
    background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px;
    padding: 10px; font-size: 12px; line-height: 1.5; color: #c4ccd8;
  }
  .chat-log::-webkit-scrollbar { width: 8px; }
  .chat-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 8px; }
  .chat-log .who { font-weight: 700; color: var(--text); }
  .chat-log .sys { color: var(--muted); }
  .chat-log .tag {
    display: inline-block; background: rgba(226,59,50,0.16); border: 1px solid rgba(226,59,50,0.45);
    color: #ffb3ad; border-radius: 6px; padding: 0 5px; font-size: 10px; margin: 0 2px; font-weight: 600;
  }
  .chat-input { display: flex; gap: 8px; }
  .chat-input input {
    flex: 1; min-width: 0; font: inherit; font-size: 12px; color: var(--text);
    padding: 9px 11px; border: 1px solid rgba(255,255,255,0.10); border-radius: 10px;
    background: rgba(0,0,0,0.30);
  }
  .chat-input input::placeholder { color: var(--muted); }
  .chat-input input:focus { outline: none; border-color: var(--accent); }
  .chat-top { display: flex; gap: 8px; align-items: center; }

  /* ----- right controls ----- */
  .ctrl-top { display: flex; flex-direction: column; gap: 8px; }
  .ctrl-row { display: flex; gap: 8px; }
  .icon-btn { width: 44px; height: 40px; font-size: 16px; display:flex; align-items:center; justify-content:center; }
  .mull { display: flex; flex-direction: column; gap: 10px; }
  .mull .btn { font: 700 18px var(--display); padding: 14px 0; letter-spacing: 1px; }
  .mull .btn.primary {
    background: linear-gradient(180deg, var(--accent), #ab2820);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 10px 24px rgba(226,59,50,0.35);
  }
  .mull .btn.primary:hover { filter: brightness(1.08); }
  .btn.concede {
    font: 700 15px var(--display); padding: 12px 0; letter-spacing: 1px;
    background: linear-gradient(180deg, rgba(226,59,50,0.15), rgba(226,59,50,0.04));
    border-color: rgba(226,59,50,0.45); color: #ff9a94;
  }
  .btn.concede:hover { background: linear-gradient(180deg, rgba(226,59,50,0.30), rgba(226,59,50,0.10)); border-color: var(--accent); color: #fff; }

  .version { position: fixed; right: 14px; bottom: 10px; font-size: 11px; color: var(--muted); z-index: 5; font-family: var(--display); letter-spacing: 1px; }

  /* ----- toast ----- */
  .toast-wrap { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 60; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast {
    background: var(--glass-2); color: var(--text); padding: 9px 16px;
    border: 1px solid var(--glass-edge);
    border-radius: 18px; font-size: 13px; font-weight: 600; animation: pop .25s ease;
    box-shadow: 0 10px 26px rgba(0,0,0,0.55);
    backdrop-filter: blur(12px);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } }

  /* centered hands variant */
  .app.layout-centered .col-left .hand { display: none; }
  .floating-hand {
    position: fixed; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: center; padding: 6px;
  }
  .floating-hand.you { bottom: 6px; }
  .floating-hand.opp { top: 6px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="image-slot.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
